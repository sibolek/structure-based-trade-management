<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#334155; stroke-width:2; rx:14; ry:14; }
      .cloud { fill:#eff6ff; stroke:#2563eb; }
      .local { fill:#f0fdf4; stroke:#16a34a; }
      .authority { fill:#fff7ed; stroke:#ea580c; }
      .ui { fill:#faf5ff; stroke:#9333ea; }
      .title { font: 700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#0f172a; }
      .text { font: 500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#1e293b; }
      .small { font: 500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569; }
      .label { font: 700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569; letter-spacing:.5px; }
      .arrow { stroke:#334155; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .boundary { stroke:#94a3b8; stroke-width:2; stroke-dasharray:8 8; }
    </style>
  </defs>
  <rect width="1400" height="720" fill="#f8fafc"/>
  <text x="700" y="48" text-anchor="middle" class="title">ExecutionOS V2.4 Candidate Feeder - Approved Architecture</text>

  <rect x="55" y="120" width="235" height="120" class="box cloud"/>
  <text x="172" y="158" text-anchor="middle" class="text">ChatGPT</text>
  <text x="172" y="186" text-anchor="middle" class="small">SOD A+ bundle or</text>
  <text x="172" y="207" text-anchor="middle" class="small">standalone candidate bundle</text>

  <rect x="365" y="120" width="235" height="120" class="box cloud"/>
  <text x="482" y="158" text-anchor="middle" class="text">Dropbox</text>
  <text x="482" y="186" text-anchor="middle" class="small">Single immutable JSON</text>
  <text x="482" y="207" text-anchor="middle" class="small">Candidate Inbox</text>

  <line x1="700" y1="85" x2="700" y2="650" class="boundary"/>
  <text x="670" y="105" text-anchor="end" class="label">CLOUD</text>
  <text x="730" y="105" class="label">STEVEN'S MAC</text>

  <rect x="785" y="120" width="235" height="120" class="box local"/>
  <text x="902" y="158" text-anchor="middle" class="text">Dropbox Desktop</text>
  <text x="902" y="186" text-anchor="middle" class="small">Inbox configured</text>
  <text x="902" y="207" text-anchor="middle" class="small">Available Offline</text>

  <rect x="1095" y="120" width="250" height="120" class="box local"/>
  <text x="1220" y="158" text-anchor="middle" class="text">Candidate Feeder</text>
  <text x="1220" y="186" text-anchor="middle" class="small">launchd-managed resident watcher</text>
  <text x="1220" y="207" text-anchor="middle" class="small">event-driven + 2s fallback scan</text>

  <rect x="1095" y="330" width="250" height="150" class="box authority"/>
  <text x="1220" y="367" text-anchor="middle" class="text">PRETRADE API</text>
  <text x="1220" y="395" text-anchor="middle" class="small">127.0.0.1:8788 only</text>
  <text x="1220" y="419" text-anchor="middle" class="small">atomic untouched-only</text>
  <text x="1220" y="441" text-anchor="middle" class="small">supersession policy</text>
  <text x="1220" y="463" text-anchor="middle" class="small">canonical candidate ingress</text>

  <rect x="785" y="345" width="235" height="120" class="box authority"/>
  <text x="902" y="382" text-anchor="middle" class="text">Canonical State</text>
  <text x="902" y="410" text-anchor="middle" class="small">WAITING / EXPIRED / etc.</text>
  <text x="902" y="432" text-anchor="middle" class="small">No auto ARM or broker writes</text>

  <rect x="785" y="555" width="235" height="105" class="box ui"/>
  <text x="902" y="592" text-anchor="middle" class="text">ExecutionOS UI</text>
  <text x="902" y="620" text-anchor="middle" class="small">authoritative snapshot poll</text>
  <text x="902" y="642" text-anchor="middle" class="small">every 1 second</text>

  <rect x="1095" y="555" width="250" height="105" class="box local"/>
  <text x="1220" y="592" text-anchor="middle" class="text">Receipt + Archive</text>
  <text x="1220" y="620" text-anchor="middle" class="small">verified result, audit trail</text>
  <text x="1220" y="642" text-anchor="middle" class="small">terminal failures -> quarantine</text>

  <path d="M290 180 L365 180" class="arrow"/>
  <path d="M600 180 L785 180" class="arrow"/>
  <path d="M1020 180 L1095 180" class="arrow"/>
  <path d="M1220 240 L1220 330" class="arrow"/>
  <path d="M1095 405 L1020 405" class="arrow"/>
  <path d="M902 465 L902 555" class="arrow"/>
  <path d="M1220 480 L1220 555" class="arrow"/>

  <text x="328" y="163" text-anchor="middle" class="small">publish</text>
  <text x="692" y="163" text-anchor="middle" class="small">sync</text>
  <text x="1056" y="163" text-anchor="middle" class="small">filesystem event</text>
  <text x="1243" y="288" class="small">POST /api/candidates/import</text>
</svg>
